<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Kütüphanesi & Yönetimi</title>
    <style>
        /* Modern ve Minimalist Koyu Tema */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: #0a0a0a;
            border: 1px solid #111;
            border-radius: 12px;
            position: relative;
        }

        header h1 {
            color: #fff;
            font-size: 2.3rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 0.95rem;
        }

        /* Oyun Ekleme Modalı ve Butonu */
        .add-game-trigger {
            position: absolute;
            right: 20px;
            top: 30px;
            background: #fff;
            color: #000;
            border: none;
            padding: 10px 18px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-game-trigger:hover {
            background: #ccc;
            transform: translateY(-2px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #0c0c0c;
            border: 1px solid #222;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            right: 20px; top: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #555;
        }

        .modal-close:hover { color: #fff; }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #141414;
            border: 1px solid #252525;
            color: #fff;
            border-radius: 6px;
        }

        .form-btn {
            width: 100%;
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Kategoriler (Tab Alanı) */
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: #0c0c0c;
            color: #888;
            border: 1px solid #1a1a1a;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: #fff;
            border-color: #444;
        }

        .tab-btn.active {
            background-color: #fff;
            color: #000;
            border-color: #fff;
        }

        /* Etiketler (Chill Alanı Filtresi) */
        .tags-container {
            display: none;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            background: #050505;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #111;
        }

        .tag-pill {
            background: #161616;
            color: #aaa;
            padding: 6px 14px;
            font-size: 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .tag-pill.excluded {
            background: #2a1114;
            color: #ff4757;
            border-color: #ff4757;
            text-decoration: line-through;
        }

        /* Oyun Grid Yapısı */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: #0c0c0c;
            border: 1px solid #161616;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #333;
        }

        .image-container {
            position: relative;
            width: 100%;
            height: 160px;
            background: #141414;
        }

        .card img.main-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Türk Bayrağı / Özel Simge */
        .overlay-icon {
            position: absolute;
            bottom: 8px;
            left: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #fff;
            z-index: 5;
            object-fit: cover;
        }

        /* Kalp Butonu */
        .favorite-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.3rem;
            transition: all 0.2s ease;
            z-index: 10;
            user-select: none;
        }

        .favorite-btn:hover {
            transform: scale(1.15);
        }

        .favorite-btn.favorited {
            color: #ff4757;
            background: #fff;
            border-color: #fff;
        }

        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.15rem;
            color: #fff;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .card-desc {
            font-size: 0.88rem;
            color: #888;
            margin-bottom: 15px;
            line-height: 1.4;
            flex-grow: 1;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #555;
            border-top: 1px solid #161616;
            padding-top: 10px;
        }

        .badge {
            background: #161616;
            color: #ccc;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 600;
        }

        /* Arka Planda Görünmeyen Narrative Alanları (Hata Vermemesi İçin) */
        #narrative-screen, #jumpscare { display: none; }
    </style>
</head>
<body>

    <div id="narrative-screen">
        <div id="npcText"></div>
        <div id="playerOptions"></div>
    </div>
    <div id="jumpscare"></div>

    <div class="container">
        <header>
            <h1>Oyun Kütüphanesi</h1>
            <p>Oyun listeleri, etiket filtreleri ve favori yönetim paneli.</p>
            <button class="add-game-trigger" onclick="toggleModal(true)">➕ Yeni Oyun Ekle</button>
        </header>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchCategory('korku', this)">Korku Oyunları</button>
            <button class="tab-btn" onclick="switchCategory('chill', this)">Chill Oyunlar</button>
            <button class="tab-btn" onclick="switchCategory('wishlist', this)">İstek Listesi (Wishlist)</button>
            <button class="tab-btn" onclick="switchCategory('favorites', this)">❤️ Favoriler</button>
        </div>

        <div class="tags-container" id="tags-filter-bar">
            </div>

        <main>
            <div class="grid" id="games-container">
                </div>
        </main>
    </div>

    <div class="modal" id="addGameModal">
        <div class="modal-content">
            <span class="modal-close" onclick="toggleModal(false)">&times;</span>
            <h3 style="margin-bottom: 20px; color:#fff;">Kütüphaneye Oyun Ekle</h3>
            
            <div class="form-group">
                <label>Oyun Adı</label>
                <input type="text" id="formName" required placeholder="Örn: Half-Life 3">
            </div>
            
            <div class="form-group">
                <label>Kategori</label>
                <select id="formCategory" onchange="handleFormCategoryChange()">
                    <option value="korku">Korku Oyunu</option>
                    <option value="chill">Chill Oyun</option>
                    <option value="wishlist">İstek Listesi (Wishlist)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Açıklama / Tür</label>
                <input type="text" id="formDesc" placeholder="Örn: Psikolojik, Hayatta Kalma veya Oyun Özeti">
            </div>

            <div class="form-group">
                <label>Oynanış Süresi / Zaman</label>
                <input type="text" id="formTime" placeholder="Örn: 2 saat veya 10-15 Saat">
            </div>

            <div class="form-group">
                <label>Görsel URL (Boş bırakılırsa Steam ID kullanılır)</label>
                <input type="text" id="formImage" placeholder="https://... /header.jpg">
            </div>

            <div class="form-group">
                <label>Steam ID (Opsiyonel)</label>
                <input type="text" id="formSteamId" placeholder="Örn: 70">
            </div>

            <div class="form-group" id="formTagsGroup" style="display:none;">
                <label>Chill Etiketleri (Virgülle ayırın)</label>
                <input type="text" id="formTags" placeholder="Örn: üretim, tıklama, ev yap">
            </div>

            <button class="form-btn" onclick="saveNewGame()">Kütüphaneye Kaydet</button>
        </div>
    </div>

        // HAFIZA ENTEGRASYONU (Dinamik eklenenler ve kalpler kaybolmasın diye)

        let chillGames = JSON.parse(localStorage.getItem('customChillGames')) || defaultChillGames;

        let favoritedGames = JSON.parse(localStorage.getItem('libraryFavorites')) || defaultFavoriteGames;

        window.chillTagsExcluded = new Set(); // Verideki orijinal Set yapısı [cite: 29]
        let currentTab = 'korku';

        // DIALOGUE TREE & HİKAYE DEĞİŞKENLERİ (Arka plan motoru için) [cite: 33]
        let gameList = [...allGames]; [cite: 33]
        let gameState = 'START';
        const dialogueTree = {
          start: { text: "Hey… yalnız mısın?", choices: [ { label: "Evet, yalnızım.", next: 'alone' }, { label: "Hayır, yalnız değilim.", next: 'not_alone' } ] }, [cite: 33]

          stream_no: { text: "Anladım… Eskiden ben de yayın yapardım. Ama o günler çok geride kaldı.", next: 'final' }, [cite: 35, 36]
          final: { text: "Oyunları seçmende belki sana yardımcı olurum. Neden beni içeri almıyorsun?", choices: [ { label: "İçeri gel.", next: 'enter' }, { label: "Git buradan.", next: 'reject' } ] }, [cite: 36, 37]
          enter: { action: () => { alert('ÖLDÜN.'); location.reload(); } }, [cite: 37]
          reject: { action: () => { console.log('NPC reddedildi'); } } [cite: 38]
        };

        // MODAL (PENCERE) KONTROLÜ
        function toggleModal(show) {
            document.getElementById('addGameModal').style.display = show ? 'flex' : 'none';
        }

        function handleFormCategoryChange() {
            const cat = document.getElementById('formCategory').value;
            document.getElementById('formTagsGroup').style.display = (cat === 'chill') ? 'block' : 'none';
        }

        // YENİ OYUN EKLEME FONKSİYONU
        function saveNewGame() {
            const name = document.getElementById('formName').value.trim();
            const category = document.getElementById('formCategory').value;
            const desc = document.getElementById('formDesc').value.trim();
            const time = document.getElementById('formTime').value.trim();
            const img = document.getElementById('formImage').value.trim();
            const steamId = document.getElementById('formSteamId').value.trim();
            const tagsInput = document.getElementById('formTags').value.trim();

            if (!name) {
                alert('Lütfen en azından bir oyun adı girin!');
                return;
            }

            if (category === 'korku') {
                allGames.push({ name, type: desc || 'Korku', playtime: time || 'Belirtilmedi', steamId, image: img });
                localStorage.setItem('customAllGames', JSON.stringify(allGames));
            } else if (category === 'chill') {
                const tagsArray = tagsInput ? tagsInput.split(',').map(t => t.trim().toLowerCase()) : ['genel'];
                chillGames.push({ name, desc: desc || 'Rahatlatıcı deneyim.', img: img || '', time: time || 'Belirtilmedi', tags: tagsArray });
                localStorage.setItem('customChillGames', JSON.stringify(chillGames));
            } else if (category === 'wishlist') {
                wishlist.push({ name, steamId, image: img });
                localStorage.setItem('customWishlist', JSON.stringify(wishlist));
            }

            alert(`${name} başarıyla kütüphaneye eklendi!`);
            toggleModal(false);
            
            // Formu temizle
            document.getElementById('formName').value = '';
            document.getElementById('formDesc').value = '';
            document.getElementById('formTime').value = '';
            document.getElementById('formImage').value = '';
            document.getElementById('formSteamId').value = '';
            document.getElementById('formTags').value = '';

            // Bulunulan sekmeyi yenile
            renderCategory(currentTab);
        }

        // KALP / FAVORİ DURUMUNU DEĞİŞTİRME
        function toggleFavorite(gameName, element, event) {
            event.stopPropagation(); // Karta tıklama eventini engellemek için
            
            if (favoritedGames.includes(gameName)) {
                favoritedGames = favoritedGames.filter(name => name !== gameName);
                element.classList.remove('favorited');
                element.innerHTML = '♡';
            } else {
                favoritedGames.push(gameName);
                element.classList.add('favorited');
                element.innerHTML = '♥';
            }
            localStorage.setItem('libraryFavorites', JSON.stringify(favoritedGames));

            // Favoriler sekmesindeysek kartı anlık listeden düşür
            if (currentTab === 'favorites') {
                renderCategory('favorites');
            }
        }

        // CHILL SEKMESİ İÇİN ETİKET SEÇİM ÇUBUĞUNU OLUŞTURMA
        function buildTagsBar() {
            const bar = document.getElementById('tags-filter-bar');
            bar.innerHTML = '';
            
            // Tüm benzersiz etiketleri topla
            const allTags = new Set();
            chillGames.forEach(g => { if(g.tags) g.tags.forEach(t => allTags.add(t)); });

            allTags.forEach(tag => {
                const pill = document.createElement('span');
                pill.className = `tag-pill ${window.chillTagsExcluded.has(tag) ? 'excluded' : ''}`;
                pill.innerText = tag.toUpperCase();
                pill.onclick = () => {
                    if (window.chillTagsExcluded.has(tag)) {
                        window.chillTagsExcluded.delete(tag);
                    } else {
                        window.chillTagsExcluded.add(tag);
                    }
                    buildTagsBar();
                    renderCategory('chill');
                };
                bar.appendChild(pill);
            });
        }

        // KATEGORİ DEĞİŞTİRME TETİKLEYİCİSİ
        function switchCategory(category, buttonElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            
            // Chill alanında filtre çubuğunu aç/kapat
            document.getElementById('tags-filter-bar').style.display = (category === 'chill') ? 'flex' : 'none';
            
            renderCategory(category);
        }

        // EKRANA OYUN KARTLARINI YANSITMA MOTORU
        function renderCategory(category) {
            currentTab = category;
            const container = document.getElementById('games-container');
            container.innerHTML = '';

            let displayList = [];

            if (category === 'korku') {
                displayList = allGames.map(g => ({
                    originalName: g.name, name: g.name, desc: 'Tür: ' + (g.type || 'Korku'),
                    img: g.image || (g.steamId ? `https://cdn.akamai.steamstatic.com/steam/apps/${g.steamId}/header.jpg` : ''),
                    badge: g.playtime || 'Süre Yok', meta: g.steamId ? 'ID: ' + g.steamId : 'Kütüphane'
                }));
            } 
            else if (category === 'chill') {
                // Elenen etiketleri filtrele
                const filteredChill = chillGames.filter(g => {
                    if (!g.tags) return true;
                    return !g.tags.some(t => window.chillTagsExcluded.has(t));
                });

                displayList = filteredChill.map(g => ({
                    originalName: g.name, name: g.name, desc: g.desc,
                    img: g.img, badge: g.time || 'Süre Yok', meta: (g.tags ? g.tags.join(', ') : 'chill')
                }));
                buildTagsBar();
            } 
            else if (category === 'wishlist') {
                displayList = wishlist.map(g => ({
                    originalName: g.name, name: g.name, desc: 'İstek listesindeki planlanan macera.',
                    img: g.image || (g.steamId ? `https://cdn.akamai.steamstatic.com/steam/apps/${g.steamId}/header.jpg` : ''),
                    badge: 'Wishlist', meta: g.steamId ? 'ID: ' + g.steamId : 'Plan', overlayIcon: g.overlayIcon
                }));
            } 
            else if (category === 'favorites') {
                // Tüm listelerden ismi favoritedGames havuzunda olanları eşleştirerek topla
                const pool = [
                    ...allGames.map(g => ({...g, pCat: 'korku'})),
                    ...chillGames.map(g => ({...g, pCat: 'chill'})),
                    ...wishlist.map(g => ({...g, pCat: 'wishlist'}))
                ];
                
                const uniqueFavs = pool.filter(g => favoritedGames.includes(g.name));

                displayList = uniqueFavs.map(g => {
                    if (g.pCat === 'korku') {
                        return { originalName: g.name, name: g.name, desc: 'Tür: ' + (g.type || 'Korku'), img: g.image || (g.steamId ? `https://cdn.akamai.steamstatic.com/steam/apps/${g.steamId}/header.jpg` : ''), badge: g.playtime, meta: 'Korku' };
                    } else if (g.pCat === 'chill') {
                        return { originalName: g.name, name: g.name, desc: g.desc, img: g.img, badge: g.time, meta: 'Chill' };
                    } else {
                        return { originalName: g.name, name: g.name, desc: 'İstek Listesi', img: g.image || (g.steamId ? `https://cdn.akamai.steamstatic.com/steam/apps/${g.steamId}/header.jpg` : ''), badge: 'Wishlist', meta: 'Plan', overlayIcon: g.overlayIcon };
                    }
                });

                if (displayList.length === 0) {
                    container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #444; margin-top: 40px; font-size: 1.1rem;">Henüz kalplenmiş favori oyununuz bulunmuyor.</div>`;
                    return;
                }
            }

            // KARTLARI HTML OLARAK OLUŞTURMA VE BASMA
            displayList.forEach(game => {
                const isFav = favoritedGames.includes(game.originalName);
                const card = document.createElement('div');
                card.className = 'card';

                const finalImg = game.img || 'https://via.placeholder.com/460x215?text=Görsel+Yok';
                const safeName = game.originalName.replace(/'/g, "\\'");

                // Eğer Türk bayrağı vb. overlayIcon varsa ekle 
                const overlayHtml = game.overlayIcon ? `<img src="${game.overlayIcon}" class="overlay-icon" alt="badge">` : ''; [cite: 30]

                card.innerHTML = `
                    <div class="image-container">
                        <div class="favorite-btn ${isFav ? 'favorited' : ''}" onclick="toggleFavorite('${safeName}', this, event)">
                            ${isFav ? '♥' : '♡'}
                        </div>
                        ${overlayHtml}
                        <img src="${finalImg}" class="main-img" alt="${game.name}" onerror="this.src='https://via.placeholder.com/460x215?text=Görsel+Yüklenemedi'">
                    </div>
                    <div class="card-content">
                        <div class="card-title">${game.name}</div>
                        <div class="card-desc">${game.desc || ''}</div>
                        <div class="card-meta">
                            <span class="badge">${game.badge || 'Süre Yok'}</span>
                            <span style="text-transform: uppercase; font-size:0.7rem; color:#444;">${game.meta || ''}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Sayfa ilk yüklendiğinde Korku listesini otomatik aç
        window.onload = () => {
            renderCategory('korku');
        };
    </script>
