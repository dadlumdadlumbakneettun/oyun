<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Kütüphanesi</title>
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: #121318;
            --text-color: #e0e0e0;
            --accent-color: #ff3333;
            --border-color: #1f2026;
            --accent-glow: rgba(255, 51, 51, 0.15);
        }

        body.chill-active {
            --bg-color: #0f0914;
            --card-bg: #1a1222;
            --text-color: #f0e6f2;
            --accent-color: #ff75a0;
            --border-color: #2e1e3b;
            --accent-glow: rgba(255, 117, 160, 0.15);
        }

        body.trash-active {
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --text-color: #d1d1d1;
            --accent-color: #ffa500;
            --border-color: #333333;
            --accent-glow: rgba(255, 165, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.5s ease;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            transition: border-color 0.5s;
        }

        .left-header {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .tab-btn {
            font-size: 26px;
            font-weight: 800;
            background: none;
            border: none;
            color: #55555d;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 1px;
        }

        .tab-btn:hover { color: #8c8c96; }

        .tab-btn.active {
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .right-header {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #181920;
            color: #b0b0bc;
            border: 1px solid #282932;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            border-color: var(--accent-color);
            color: #fff;
            background: #1f202a;
        }

        .save-btn {
            background: #101810;
            color: #4caf50;
            border: 1px solid #2a4a2a;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }

        .save-btn:hover {
            background: #162416;
            border-color: #4caf50;
            color: #6fcf73;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.2);
        }

        .save-btn.saved {
            background: #1a3a1a;
            border-color: #4caf50;
            color: #81c784;
            pointer-events: none;
        }

        .save-btn .save-icon { font-size: 14px; }

        .add-btn {
            font-size: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--accent-color);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .add-btn:hover {
            transform: scale(1.1);
            filter: brightness(1.1);
        }

        .container {
            max-width: 1400px;
            margin: 40px auto 0;
            padding: 0 20px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4), 0 0 15px var(--accent-glow);
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 155px;
            background-color: #050505;
        }

        .game-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .heart-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8));
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 5;
            user-select: none;
        }

        .heart-badge:hover { transform: scale(1.2); }

        .card-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .game-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .game-desc {
            font-size: 13px;
            color: #90909a;
            line-height: 1.4;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .game-meta {
            font-size: 12px;
            color: #6a6a75;
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
        }

        .tag {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tag-anomali { background-color: #8e44ad; color: #fff; }
        .tag-korku { background-color: #962d2d; color: #fff; }
        .tag-bulmaca { background-color: #2980b9; color: #fff; }
        .tag-japon { background-color: #d35400; color: #fff; }
        .tag-üretim { background-color: #27ae60; color: #fff; }
        .tag-tıklama { background-color: #16a085; color: #fff; }
        .tag-ev { background-color: #f39c12; color: #000; }
        .tag-dünya { background-color: #117a8b; color: #fff; }
        .tag-adhd { background-color: #6c757d; color: #fff; }
        .tag-yürüme { background-color: #6f42c1; color: #fff; }
        .tag-demo { background-color: #e83e8c; color: #fff; }
        .tag-macera { background-color: #20c997; color: #fff; }
        .tag-default { background-color: #2a2c35; color: #b0b0b0; }

        .card-actions {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #6a6a75;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
        }

        .delete-btn:hover { color: #ff4757; }

        .restore-btn {
            background: none;
            border: none;
            color: #4caf50;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
        }

        .restore-btn:hover { color: #81c784; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background-color: #101114;
            border: 1px solid #23252d;
            border-radius: 14px;
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #555;
            transition: color 0.2s;
        }

        .close-modal:hover { color: #fff; }

        .modal h3 {
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: 800;
            color: #fff;
            border-bottom: 1px solid #23252d;
            padding-bottom: 10px;
        }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #80808a;
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: #08080a;
            border: 1px solid #23252d;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .tags-manager {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background-color: #08080a;
            padding: 10px;
            border: 1px solid #23252d;
            border-radius: 6px;
            margin-bottom: 10px;
            min-height: 45px;
        }

        .tag-pill {
            background-color: var(--card-bg);
            border: 1px solid #2e303d;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-pill:hover {
            background-color: #ff4757;
            color: white;
            border-color: #ff4757;
        }

        .add-tag-box {
            display: flex;
            gap: 8px;
        }

        .add-tag-box input { flex-grow: 1; }

        .add-tag-btn {
            background-color: #23252d;
            color: #fff;
            border: 1px solid #333;
            padding: 0 15px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
        }

        .add-tag-btn:hover {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .submit-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: #000;
            font-weight: 700;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: filter 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover { filter: brightness(1.1); }

        .hidden-file { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="left-header">
            <button class="tab-btn active" id="tab-horror" onclick="switchTab('horror')">KORKU</button>
            <button class="tab-btn" id="tab-chill" onclick="switchTab('chill')">CHILL</button>
            <button class="tab-btn" id="tab-trash" onclick="switchTab('trash')">ÇÖP KUTUSU</button>
        </div>
        <div class="right-header">
            <button class="save-btn" id="save-btn" onclick="manualSave()">
                <span class="save-icon">💾</span>
                <span class="save-label">Kaydet</span>
            </button>
            <button class="action-btn" onclick="exportToJS()">JS Dışa Aktar</button>
            <button class="action-btn" onclick="exportToManifest()">Manifest Dışa Aktar</button>
            <button class="action-btn" onclick="document.getElementById('import-file-input').click()">İçe Aktar</button>
            <input type="file" id="import-file-input" class="hidden-file" accept=".json,.txt,.js" onchange="importData(event)">
            <button class="add-btn" onclick="openModal()">+</button>
        </div>
    </header>

    <div class="container">
        <div class="game-grid" id="game-container"></div>
    </div>

    <!-- Yeni Oyun Ekleme Modalı -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 id="modal-title">Yeni Oyun Ekle</h3>
            <form id="game-form" onsubmit="addGame(event)">
                <div class="form-group">
                    <label>Steam Ürün Linki (Otomatik Doldurma)</label>
                    <input type="url" id="form-steam-link" placeholder="Örn: https://store.steampowered.com/app/2653790/THE_EXIT_8/" oninput="parseSteamLink(this.value)">
                </div>
                <div class="form-group">
                    <label>Eklenecek Kategori</label>
                    <select id="form-category" onchange="toggleFormTagsField()" required>
                        <option value="horror">Korku (Horror)</option>
                        <option value="chill">Chill</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Oyun Adı</label>
                    <input type="text" id="form-name" required placeholder="Örn: THE EXIT 9">
                </div>
                <div class="form-group">
                    <label>Resim Linki (URL)</label>
                    <input type="url" id="form-image" placeholder="Boş bırakılırsa Steam ID kullanılır">
                </div>
                <div class="form-group">
                    <label>Steam ID (Opsiyonel)</label>
                    <input type="text" id="form-steamid" placeholder="Resim ve kütüphane bağlamı için">
                </div>
                <div class="form-group">
                    <label>Yayınlanma Yılı (Opsiyonel)</label>
                    <input type="number" id="form-year" placeholder="Örn: 2026">
                </div>
                <div class="form-group">
                    <label>Oynanış Süresi</label>
                    <select id="form-playtime" required>
                        <option value="30 dakika altı">30 dakika altı</option>
                        <option value="30-1 saat arası">30-1 saat arası</option>
                        <option value="1-2 saat arası">1-2 saat arası</option>
                        <option value="2 saat üstü">2 saat üstü</option>
                    </select>
                </div>
                <div class="form-group" id="tags-field" style="display: none;">
                    <label>Chill Etiketleri (Virgülle ayırın)</label>
                    <input type="text" id="form-tags" placeholder="Örn: üretim, bulmaca, ev yap">
                </div>
                <div class="form-group">
                    <label>Açıklama (Detayda görünür)</label>
                    <textarea id="form-desc" rows="3" placeholder="Oyun hakkında detaylı bilgi..."></textarea>
                </div>
                <div class="form-group" style="display: flex; gap: 8px; align-items: center;">
                    <input type="checkbox" id="form-favorite" style="width: auto; cursor: pointer;">
                    <label for="form-favorite" style="margin-bottom: 0; cursor: pointer;">Favori olarak işaretle ❤️</label>
                </div>
                <button type="submit" class="submit-btn">Kütüphaneye Ekle</button>
            </form>
        </div>
    </div>

    <!-- Düzenleme / Detay Modalı -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeEditModal()">&times;</span>
            <h3 id="edit-modal-title">Oyun Detayları & Düzenle</h3>
            <form id="edit-game-form" onsubmit="saveEditedGame(event)">
                <input type="hidden" id="edit-index">
                <div class="form-group">
                    <label>Oyun Adı</label>
                    <input type="text" id="edit-name" required>
                </div>
                <div class="form-group">
                    <label>Resim Linki (URL)</label>
                    <input type="url" id="edit-image" placeholder="SteamID yoksa zorunludur">
                </div>
                <div class="form-group">
                    <label>Steam ID</label>
                    <input type="text" id="edit-steamid">
                </div>
                <div class="form-group">
                    <label>Yayınlanma Yılı</label>
                    <input type="number" id="edit-year">
                </div>
                <div class="form-group">
                    <label>Oynanış Süresi</label>
                    <select id="edit-playtime" required>
                        <option value="30 dakika altı">30 dakika altı</option>
                        <option value="30-1 saat arası">30-1 saat arası</option>
                        <option value="1-2 saat arası">1-2 saat arası</option>
                        <option value="2 saat üstü">2 saat üstü</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Oyun Açıklaması</label>
                    <textarea id="edit-desc" rows="4" placeholder="Oyun hakkında geniş açıklama..."></textarea>
                </div>
                <div class="form-group">
                    <label>Etiket Yönetimi (Silmek için etikete tıklayın)</label>
                    <div class="tags-manager" id="edit-tags-container"></div>
                    <div class="add-tag-box">
                        <input type="text" id="new-tag-input" placeholder="Yeni etiket adı...">
                        <button type="button" class="add-tag-btn" onclick="addNewTag()">Ekle</button>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Değişiklikleri Kaydet</button>
            </form>
        </div>
    </div>

    <script>
        // MASTER MANIFEST VERİSİ (Birebir Kaynak Doğrulamalı Girdi)
        const MASTER_MANIFEST = {
          "allGames": [
            { "name": "Scary Game 2 The Mad Shepherd", "type": "Korku", "playtime": "30 dakika altı", "desc": "köyde yeni çoban olarak ilk günün... ve her şey ters gidiyor. hayvanlar kayıp. Köylüler garip. Gerçek ise daha korkunç", "steamId": "4479970", "image": "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/4479970/6d3ae95a5b6d5b61c7e81d76f4d68abe603b6607/ss_6d3ae95a5b6d5b61c7e81d76f4d68abe603b6607.1920x1080.jpg?t=1779180438", "year": 2026 },
            { "name": "Below", "type": "Korku", "playtime": "30-1 saat arası", "desc": "Bu birinci şahıs bakış açılı, “buluntu görüntü” tarzındaki psikolojik korku oyununda, kalp atışlarınızı hızlandıran kovalamacaların üstesinden gelin. Bir video kameranın yardımıyla, büyük piramidin altındaki karanlık mezarları ve dar koridorları keşfedin. Piramidin korkunç sırlarını ortaya çıkarın, pil seviyenizi iyi yönetin ve eğer başarabilirseniz, HAYATTA KALIN.", "steamId": "4043280", "image": "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/4043280/e9099bc6d9a46030849da4033d77a8573f12f4cd/header.jpg?t=1782213425", "year": 2026 },
            { "name": "Tales Beyond The Tomb No Witnesses", "type": "Korku", "playtime": "1-2 saat arası", "desc": "Gerçek hayattan rahatsız edici vakalardan esinlenilmiş psikolojik bir korku antolojisi. Tanık Yok adlı öyküde, iki kız kardeşin geceleri otoyollarda dolaşan acımasız bir seri katille karşılaşmasıyla basit bir yolculuk, hayatta kalma mücadelesine dönüşüyor.", "steamId": "4483120", "image": "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/4483120/efae84d8065c445a918d46681e9e73a18121b156/header.jpg?t=1781916044", "year": 2026 },
            { "name": "Tostchu", "type": "korku", "playtime": "2 saat üstü", "image": "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2221500/header.jpg?t=1730124471", "steamId": "", "year": 2024, "desc": "Anadolu'nun ıssız bir köşesinde tostçu dükkanı işletmeyi konu alan, psikolojik gerilim içeren atmosferik bir korku oyunu. Gelen müşteriler için tost yap, para kazan, malzeme satın al ve tuhaf olaylara tanık ol." },
            { "name": "DREAD FLATS", "type": "korku, bulmaca", "playtime": "1-2 saat arası", "steamId": "3114900", "year": "", "desc": "Bu, birinci şahıs bakış açısıyla oynanan Çin yapımı bir korku oyunudur. Oyuncular bir cinayet mahalline gidecek, cinayetin ardındaki gerçeği ortaya çıkaracak ve kayıp kişileri bulacaklardır.", "image": "" },
            { "name": "THE KIDNAP", "type": "gerilim, japon korku", "playtime": "1-2 saat arası", "steamId": "2593900", "year": 2023, "desc": "Kaçırma | bir kaçırılma olayını konu alan bir korku oyunudur.", "image": "" },
            { "name": "THE EXIT 8", "type": "anomali", "playtime": "30 dakika altı", "steamId": "2653790", "year": 2023, "desc": "Sonsuz bir yeraltı geçidinde mahsur kaldınız. \"8 Numaralı Çıkış\"a ulaşmak için çevrenizi dikkatlice gözlemleyin.", "image": "https://m.media-amazon.com/images/S/pv-target-images/454c819e446250e3220eee68135aa077ec22ec3f581a9259b0612d72d5769ba1._SX1080_FMjpg_.jpg" },
            { "name": "SHINKANSE 0", "type": "zor anomali", "playtime": "30-1 saat arası", "steamId": "2793370", "year": 2024, "desc": "Oyuncuların Shinkansen'de (Japon hızlı treni) anormallikler bulmakla görevlendirildiği bir oyundur.", "image": "" },
            { "name": "WE HARVEST SHADOWS", "type": "indie demo korku, demo", "playtime": "2 saat üstü", "steamId": "1559720", "year": "", "desc": "Demo Birinci şahıs perspektifinden bir çiftçilik korku alegorisi. Toplumdan uzaklaş, çiftliğini kur ve yalnız gecelerde hayatta kal.", "image": "" },
            { "name": "THE STAIRWAY 7", "type": "anomali, kedy", "playtime": "30-1 saat arası", "steamId": "2911820", "year": 2024, "desc": "Stairway 7, bir kedi ile birlikte sonsuz bir merdiven döngüsünde mahsur kaldığınız ve çıkışa ulaşmak için çevrenizi dikkatle gözlemlemeniz gereken, sonsuz döngülü bir anomali avı ve gözlem temalı “farkı bul” oyunudur. Anomaliler sizi izliyor ve sizi avlamaya hazır. Onları yanınızda götürmeyin.", "image": "" },

        // RUNTIME DEĞİŞKENLERİ
        let allGames = [];
        let chillGames = [];
        let favoriteGames = [];
        let trashGames = [];
        let deletedHorror = [];
        let deletedChill = [];

        let currentTab = 'horror';
        let activeEditTags = [];

        // ENTEGRE LOCALSTORAGE SİSTEMİ
        function saveStateToLocal() {
            localStorage.setItem('lib_allGames',      JSON.stringify(allGames));
            localStorage.setItem('lib_chillGames',    JSON.stringify(chillGames));
            localStorage.setItem('lib_favoriteGames', JSON.stringify(favoriteGames));
            localStorage.setItem('lib_trashGames',    JSON.stringify(trashGames));
            localStorage.setItem('lib_deletedHorror', JSON.stringify(deletedHorror));
            localStorage.setItem('lib_deletedChill',  JSON.stringify(deletedChill));
        }

        function loadState() {
            try {
                const savedAll   = localStorage.getItem('lib_allGames');
                const savedChill = localStorage.getItem('lib_chillGames');
                const savedFav   = localStorage.getItem('lib_favoriteGames');
                const savedTrash = localStorage.getItem('lib_trashGames');
                const savedDelH  = localStorage.getItem('lib_deletedHorror');
                const savedDelC  = localStorage.getItem('lib_deletedChill');

                if (savedAll && savedChill && savedFav && savedTrash) {
                    allGames      = JSON.parse(savedAll);
                    chillGames    = JSON.parse(savedChill);
                    favoriteGames = JSON.parse(savedFav);
                    trashGames    = JSON.parse(savedTrash);
                    deletedHorror = savedDelH ? JSON.parse(savedDelH) : [...MASTER_MANIFEST.deletedHorror];
                    deletedChill  = savedDelC ? JSON.parse(savedDelC) : [...MASTER_MANIFEST.deletedChill];
                } else {
                    // İlk yüklemede manifest verisini filtreleyerek al (Kalıntı veya yanlış kategori eşleşmelerini önler)
                    allGames = MASTER_MANIFEST.allGames.filter(g => 
                        !MASTER_MANIFEST.deletedHorror.some(d => d.toLowerCase() === g.name.toLowerCase()) &&
                        !MASTER_MANIFEST.trashGames.some(t => t.game.name.toLowerCase() === g.name.toLowerCase())
                    );
                    
                    chillGames = MASTER_MANIFEST.chillGames.filter(g => 
                        !MASTER_MANIFEST.deletedChill.some(d => d.toLowerCase() === g.name.toLowerCase()) &&
                        !MASTER_MANIFEST.trashGames.some(t => t.game.name.toLowerCase() === g.name.toLowerCase())
                    );

                    favoriteGames = [...MASTER_MANIFEST.favoriteGames];
                    trashGames    = [...MASTER_MANIFEST.trashGames];
                    deletedHorror = [...MASTER_MANIFEST.deletedHorror];
                    deletedChill  = [...MASTER_MANIFEST.deletedChill];
                    saveStateToLocal();
                }
            } catch (e) {
                console.error("Yükleme hatası, veriler sıfırlanıyor:", e);
                resetToMasterManifest();
            }
        }

        function resetToMasterManifest() {
            allGames      = JSON.parse(JSON.stringify(MASTER_MANIFEST.allGames));
            chillGames    = JSON.parse(JSON.stringify(MASTER_MANIFEST.chillGames));
            favoriteGames = [...MASTER_MANIFEST.favoriteGames];
            trashGames    = [...MASTER_MANIFEST.trashGames];
            deletedHorror = [...MASTER_MANIFEST.deletedHorror];
            deletedChill  = [...MASTER_MANIFEST.deletedChill];
            saveStateToLocal();
        }

        // STEAM URL AYRIŞTIRICI
        function parseSteamLink(url) {
            if (!url) return;
            const match = url.match(/\/app\/(\d+)(?:\/([^\/?#]+))?/);
            if (match) {
                const steamId = match[1];
                document.getElementById('form-steamid').value = steamId;
                document.getElementById('form-image').value = `https://cdn.akamai.steamstatic.com/steam/apps/${steamId}/header.jpg`;
                
                if (match[2]) {
                    let cleanName = match[2].replace(/[_\-]+/g, ' ');
                    cleanName = cleanName.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
                    document.getElementById('form-name').value = cleanName;
                }
            }
        }

        function manualSave() {
            saveStateToLocal();
            const btn   = document.getElementById('save-btn');
            const label = btn.querySelector('.save-label');
            btn.classList.add('saved');
            label.textContent = 'Kaydedildi ✓';
            setTimeout(() => {
                btn.classList.remove('saved');
                label.textContent = 'Kaydet';
            }, 2000);
        }

        function getTagClass(tag) {
            tag = tag.toLowerCase().trim();
            if (tag.includes('anomali'))   return 'tag-anomali';
            if (tag.includes('korku'))     return 'tag-korku';
            if (tag.includes('bulmaca'))   return 'tag-bulmaca';
            if (tag.includes('japon'))     return 'tag-japon';
            if (tag.includes('üretim'))    return 'tag-üretim';
            if (tag.includes('tıklama'))   return 'tag-tıklama';
            if (tag.includes('ev yap') || tag.includes('ev')) return 'tag-ev';
            if (tag.includes('dünya'))     return 'tag-dünya';
            if (tag.includes('adhd'))      return 'tag-adhd';
            if (tag.includes('yürüme'))    return 'tag-yürüme';
            if (tag.includes('demo'))      return 'tag-demo';
            if (tag.includes('macera'))    return 'tag-macera';
            return 'tag-default';
        }

        function renderGames() {
            const container = document.getElementById('game-container');
            container.innerHTML = '';
            
            let list = [];
            if (currentTab === 'horror') list = allGames;
            else if (currentTab === 'chill') list = chillGames;
            else if (currentTab === 'trash') list = trashGames;

            list.forEach((item, index) => {
                const isTrash = (currentTab === 'trash');
                const game = isTrash ? item.game : item;
                const isFavorite = favoriteGames.some(f => f.toLowerCase() === game.name.toLowerCase());

                let gameImg = game.image || game.img || '';
                if (!gameImg && game.steamId) {
                    gameImg = `https://cdn.akamai.steamstatic.com/steam/apps/${game.steamId}/header.jpg`;
                }

                let tagsArray = [];
                if (game.type)       tagsArray = game.type.split(',').map(t => t.trim());
                else if (game.tags)  tagsArray = game.tags;

                const playtime = game.playtime || game.time || 'Süre girilmedi';
                const safeName = game.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');

                const card = document.createElement('div');
                card.className = 'game-card';
                if (!isTrash) {
                    card.setAttribute('onclick', `openEditModal(${index}, '${currentTab}')`);
                }

                card.innerHTML = `
                    <div class="image-wrapper">
                        ${!isTrash ? `
                        <div class="heart-badge" onclick="toggleFavorite('${safeName}', event)">
                            ${isFavorite ? '❤️' : '🤍'}
                        </div>` : ''}
                        ${gameImg
                            ? `<img src="${gameImg}" class="game-img" alt="${game.name}" onerror="this.src='https://via.placeholder.com/460x215?text=Görsel+Bulunamadı'">`
                            : `<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#555;font-size:13px;font-style:italic;">Görsel Tanımlı Değil</div>`
                        }
                    </div>
                    <div class="card-content">
                        <div>
                            <div class="game-title">${game.name}</div>
                            ${game.desc ? `<div class="game-desc">${game.desc}</div>` : ''}
                            <div class="game-meta">
                                <span>⏱️ ${playtime}</span>
                                ${game.year ? `<span>📅 ${game.year}</span>` : ''}
                            </div>
                        </div>
                        <div>
                            <div class="tag-container">
                                ${tagsArray.filter(t => t).map(tag => `<span class="tag ${getTagClass(tag)}">${tag}</span>`).join('')}
                            </div>
                            <div class="card-actions">
                                ${isTrash ? `
                                    <button class="restore-btn" onclick="restoreGame(${index}, event)">Geri Yükle ↩️</button>
                                    <button class="delete-btn" onclick="permanentlyDeleteGame(${index}, event)">Kalıcı Sil ❌</button>
                                ` : `
                                    <button class="delete-btn" onclick="deleteGame(${index}, event)">Sil 🗑️</button>
                                `}
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-horror').classList.toggle('active', tab === 'horror');
            document.getElementById('tab-chill').classList.toggle('active', tab === 'chill');
            document.getElementById('tab-trash').classList.toggle('active', tab === 'trash');
            
            document.body.classList.toggle('chill-active', tab === 'chill');
            document.body.classList.toggle('trash-active', tab === 'trash');
            renderGames();
        }

        function toggleFavorite(gameName, event) {
            if (event) event.stopPropagation();
            const i = favoriteGames.findIndex(f => f.toLowerCase() === gameName.toLowerCase());
            if (i > -1) favoriteGames.splice(i, 1);
            else         favoriteGames.push(gameName);
            saveStateToLocal();
            renderGames();
        }

        function openModal() {
            document.getElementById('add-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('add-modal').style.display = 'none';
            document.getElementById('game-form').reset();
            toggleFormTagsField();
        }

        function toggleFormTagsField() {
            const cat = document.getElementById('form-category').value;
            document.getElementById('tags-field').style.display = (cat === 'chill') ? 'block' : 'none';
        }

        function addGame(e) {
            e.preventDefault();
            const category = document.getElementById('form-category').value;
            const name     = document.getElementById('form-name').value.trim();
            const image    = document.getElementById('form-image').value.trim();
            const steamId  = document.getElementById('form-steamid').value.trim();
            const year     = parseInt(document.getElementById('form-year').value) || '';
            const playtime = document.getElementById('form-playtime').value;
            const tags     = document.getElementById('form-tags').value.trim();
            const desc     = document.getElementById('form-desc').value.trim();
            const favorite = document.getElementById('form-favorite').checked;

            if (favorite && !favoriteGames.some(f => f.toLowerCase() === name.toLowerCase())) {
                favoriteGames.push(name);
            }

            if (category === 'horror') {
                const g = { name, type: tags || 'Korku', playtime, desc };
                if (steamId) g.steamId = steamId;
                if (image)   g.image   = image;
                if (year)    g.year    = year;
                allGames.unshift(g);
                deletedHorror = deletedHorror.filter(d => d.toLowerCase() !== name.toLowerCase());
            } else {
                const g = { name, desc: desc || 'Açıklama girilmedi.', time: playtime, tags: tags ? tags.split(',').map(t => t.trim()) : ['chill'] };
                if (image)   g.img    = image;
                if (steamId) g.steamId = steamId;
                if (year)    g.year    = year;
                chillGames.unshift(g);
                deletedChill = deletedChill.filter(d => d.toLowerCase() !== name.toLowerCase());
            }

            saveStateToLocal();
            closeModal();
            renderGames();
        }

        function openEditModal(index, tab) {
            const list = (tab === 'horror') ? allGames : chillGames;
            const game = list[index];

            document.getElementById('edit-index').value    = index;
            document.getElementById('edit-name').value     = game.name || '';
            document.getElementById('edit-image').value    = game.image || game.img || '';
            document.getElementById('edit-steamid').value  = game.steamId || '';
            document.getElementById('edit-year').value     = game.year || '';
            document.getElementById('edit-desc').value     = game.desc || '';

            const playtimeVal = game.playtime || game.time || '30-1 saat arası';
            const selectPlaytime = document.getElementById('edit-playtime');
            if ([...selectPlaytime.options].some(o => o.value === playtimeVal)) {
                selectPlaytime.value = playtimeVal;
            } else {
                selectPlaytime.value = "30-1 saat arası";
            }

            if (game.type)       activeEditTags = game.type.split(',').map(t => t.trim()).filter(t => t);
            else if (game.tags)  activeEditTags = [...game.tags];
            else                 activeEditTags = [];

            renderEditTags();
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
            document.getElementById('edit-game-form').reset();
        }

        function renderEditTags() {
            const container = document.getElementById('edit-tags-container');
            container.innerHTML = '';
            if (activeEditTags.length === 0) {
                container.innerHTML = `<span style="color:#555;font-size:13px;font-style:italic;">Henüz etiket yok.</span>`;
                return;
            }
            activeEditTags.forEach((tag, i) => {
                const pill = document.createElement('span');
                pill.className = 'tag-pill';
                pill.innerHTML = `${tag.toUpperCase()} <span style="color:#ff4757;font-weight:bold;margin-left:5px;">&times;</span>`;
                pill.setAttribute('onclick', `removeTag(${i})`);
                container.appendChild(pill);
            });
        }

        function removeTag(index) {
            activeEditTags.splice(index, 1);
            renderEditTags();
        }

        function addNewTag() {
            const input = document.getElementById('new-tag-input');
            const val   = input.value.trim().toLowerCase();
            if (val && !activeEditTags.includes(val)) {
                activeEditTags.push(val);
                renderEditTags();
                input.value = '';
            }
        }

        function saveEditedGame(e) {
            e.preventDefault();
            const index    = parseInt(document.getElementById('edit-index').value);
            const name     = document.getElementById('edit-name').value.trim();
            const image    = document.getElementById('edit-image').value.trim();
            const steamId  = document.getElementById('edit-steamid').value.trim();
            const year     = parseInt(document.getElementById('edit-year').value) || '';
            const playtime = document.getElementById('edit-playtime').value;
            const desc     = document.getElementById('edit-desc').value.trim();

            const list = (currentTab === 'horror') ? allGames : chillGames;
            const game = list[index];

            const favIdx = favoriteGames.findIndex(f => f.toLowerCase() === game.name.toLowerCase());
            if (favIdx > -1) favoriteGames[favIdx] = name;

            game.name    = name;
            game.steamId = steamId;
            game.year    = year;
            game.desc    = desc;

            if (currentTab === 'horror') {
                game.image    = image;
                game.playtime = playtime;
                game.type     = activeEditTags.join(', ');
            } else {
                game.img  = image;
                game.time = playtime;
                game.tags = [...activeEditTags];
            }

            saveStateToLocal();
            closeEditModal();
            renderGames();
        }

        // ÇÖP KUTUSU VE SİLME MEKANİZMALARI
        function deleteGame(index, event) {
            if (event) event.stopPropagation();
            if (currentTab === 'horror') {
                const game = allGames.splice(index, 1)[0];
                trashGames.push({ game: game, from: 'horror' });
            } else if (currentTab === 'chill') {
                const game = chillGames.splice(index, 1)[0];
                trashGames.push({ game: game, from: 'chill' });
            }
            saveStateToLocal();
            renderGames();
        }

        function restoreGame(index, event) {
            if (event) event.stopPropagation();
            const trashedItem = trashGames.splice(index, 1)[0];
            if (trashedItem.from === 'horror') {
                allGames.unshift(trashedItem.game);
            } else if (trashedItem.from === 'chill') {
                chillGames.unshift(trashedItem.game);
            }
            saveStateToLocal();
            renderGames();
        }

        function permanentlyDeleteGame(index, event) {
            if (event) event.stopPropagation();
            if (confirm("Bu oyunu kalıcı olarak silmek istediğine emin misin?")) {
                const trashedItem = trashGames[index];
                const name = trashedItem.game.name;
                
                if (trashedItem.from === 'horror') {
                    if (!deletedHorror.some(d => d.toLowerCase() === name.toLowerCase())) {
                        deletedHorror.push(name);
                    }
                } else {
                    if (!deletedChill.some(d => d.toLowerCase() === name.toLowerCase())) {
                        deletedChill.push(name);
                    }
                }
                trashGames.splice(index, 1);
                saveStateToLocal();
                renderGames();
            }
        }

        // DIŞA / İÇE AKTARIM SİSTEMLERİ
        function exportToJS() {
            let js = `const allGames = ${JSON.stringify(allGames, null, 2)};\n\n`;
            js    += `const chillGames = ${JSON.stringify(chillGames, null, 2)};\n\n`;
            js    += `const favoriteGames = ${JSON.stringify(favoriteGames, null, 2)};`;
            triggerDownload(js, 'data.js', 'text/javascript');
        }

        function exportToManifest() {
            const manifest = { allGames, chillGames, favoriteGames, trashGames, deletedHorror, deletedChill };
            triggerDownload(JSON.stringify(manifest, null, 2), 'manifest.json', 'application/json');
        }

        function triggerDownload(content, filename, contentType) {
            const blob = new Blob([content], { type: contentType });
            const a    = document.createElement('a');
            a.href     = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            a.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                try {
                    const trimmed = text.trim();
                    if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
                        const parsed = JSON.parse(trimmed);
                        if (parsed.allGames)      allGames      = parsed.allGames;
                        if (parsed.chillGames)    chillGames    = parsed.chillGames;
                        if (parsed.favoriteGames) favoriteGames = parsed.favoriteGames;
                        if (parsed.trashGames)    trashGames    = parsed.trashGames;
                        if (parsed.deletedHorror) deletedHorror = parsed.deletedHorror;
                        if (parsed.deletedChill)  deletedChill  = parsed.deletedChill;
                        saveStateToLocal();
                        renderGames();
                        alert('Manifest yedeği başarıyla yüklendi!');
                    } else if (text.includes('allGames') || text.includes('chillGames')) {
                        const extract = (varName) => {
                            const rx = new RegExp('(?:const|let|var|window\\.)?\\s*' + varName + '\\s*=\\s*(\\[[\\s\\S]*?\\])\\s*(?:;|\\r|\\n|$)');
                            const m  = text.match(rx);
                            return m ? new Function('return ' + m[1])() : null;
                        };
                        const pAll  = extract('allGames');
                        const pChill= extract('chillGames');
                        const pFav  = extract('favoriteGames');
                        if (pAll)   allGames      = pAll;
                        if (pChill) chillGames    = pChill;
                        if (pFav)   favoriteGames = pFav;
                        saveStateToLocal();
                        renderGames();
                        alert('JS yedeği başarıyla yüklendi!');
                    } else {
                        alert('Uyumsuz dosya formatı.');
                    }
                } catch (err) {
                    alert('Dosya işlenirken hata oluştu.');
                    console.error(err);
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        window.onload = function() {
            loadState();
            renderGames();
        };
    </script>
</body>
</html>
